name: pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 저장소와 같은 배치로 올리기 때문에 app.js가 그대로 ../data/*.csv를
      # fetch한다. 로컬에서 `python3 -m http.server`로 볼 때와 경로가 갈리지
      # 않는다. 루트 index.html은 /web/으로 보내는 리다이렉트다 — 이게 없으면
      # 사이트 루트 주소가 404가 된다.
      - name: Assemble site
        run: |
          mkdir -p _site/web _site/data
          cp -r web/. _site/web/
          cp -r data/. _site/data/
          printf '%s\n' \
            '<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,">' \
            '<meta http-equiv="refresh" content="0; url=web/">' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
