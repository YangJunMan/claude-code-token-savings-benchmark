name: pages

# code는 main, 데이터는 data에서 가져온다. data는 workflow가 없는 orphan
# 브랜치이며 GITHUB_TOKEN push는 다른 workflow를 시작하지 않는다.
# 따라서 측정 완료는 default branch의 workflow_run으로 받는다.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "scripts/build_site.py"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: [bench]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # 측정 데이터는 main에 없다 — 봇이 data 브랜치에만 커밋한다.
      - uses: actions/checkout@v4
        with:
          ref: data
          path: _data
      # 저장소와 같은 배치로 올리기 때문에 app.js가 그대로 ../data/*.csv를
      # fetch한다. 로컬에서 `python3 -m http.server`로 볼 때와 경로가 갈리지
      # 않는다. 루트 index.html은 /web/으로 보내는 리다이렉트다 — 이게 없으면
      # 사이트 루트 주소가 404가 된다.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assemble and verify all recorded experiments
        run: python3 scripts/build_site.py --data-root _data/data --output _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
