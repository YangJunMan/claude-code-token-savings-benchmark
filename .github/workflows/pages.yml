name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # The page is published with the same layout it has in the repository, so
      # app.js keeps fetching ../data/*.csv and there is no second set of paths
      # that can drift from the ones a local `python3 -m http.server` serves.
      - name: Stage the site
        run: |
          mkdir -p site
          cp -R web site/web
          cp -R data site/data
          # The icon link keeps the browser from probing /favicon.ico on the
          # domain root, which 404s on the way through to /web/.
          printf '%s\n' \
            '<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,">' \
            '<meta http-equiv="refresh" content="0; url=web/">' > site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
