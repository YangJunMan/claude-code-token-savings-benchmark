name: self-heal

# bench가 실패하면 원인을 읽고 수정안을 PR로 올린다. main에 직접 push하지
# 않는다 — 잘못된 코드가 자동 병합되면 실험이 멈추고, 그 책임은 사람이 진다
# (사용자 결정). 병합은 항상 사람이 한다.
#
# 이 워크플로가 손댈 수 있는 파일은 ALLOWED_PATHS로 제한된다. 에이전트에게
# 부탁하는 것으로는 부족하므로, 실행 후 diff를 검사해 워크플로가 강제한다.
on:
  workflow_run:
    workflows: [bench]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: self-heal
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  # 자동 수정을 허용하는 범위. 운영 파라미터만이다 — 측정 로직·테스트·웹은
  # 사람이 고친다. tests/를 이 목록에 넣으면 에이전트가 테스트를 고쳐서
  # 통과시킬 수 있으므로 절대 넣지 않는다.
  ALLOWED_PATHS: "token_bench/diagnostics.py .github/workflows/bench.yml"
  BRANCH: self-heal/auto

jobs:
  repair:
    # 성공한 bench에는 고칠 것이 없다.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Skip when a self-heal PR is already open
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          open=$(gh pr list --state open --head "$BRANCH" --json number --jq 'length')
          echo "open=$open" >> "$GITHUB_OUTPUT"
          if [ "$open" != "0" ]; then
            echo "이미 열린 self-heal PR이 있다. 사람이 처리할 때까지 새로 만들지 않는다."
          fi

      - name: Collect failure context
        if: steps.guard.outputs.open == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -n "${RUN_ID:-}" ]; then
            gh run view "$RUN_ID" --log-failed > failure.log 2>&1 || true
          fi
          # 로그가 비면 에이전트가 추측으로 고치게 되므로 그 경우는 중단한다.
          tail -c 20000 failure.log > context.log 2>/dev/null || true
          test -s context.log

      - name: Propose a fix
        if: steps.guard.outputs.open == '0'
        env:
          # 측정 실행이 아니므로 구독이 아니라 API key로 돈다 — 유지보수가
          # 실험용 구독 한도를 먹지 않게 한다.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import re, pathlib; print(re.search(r'CLAUDE_CODE_VERSION: (\S+)', pathlib.Path('.github/workflows/bench.yml').read_text()).group(1))")
          npm install -g "@anthropic-ai/claude-code@${version}"
          # 읽기와 파일 편집만 준다. Bash를 주지 않으므로 이 단계에서 임의
          # 명령이 돌지 않는다. 범위 검사(다음 단계)와 이중으로 막는다.
          #
          # 프롬프트는 stdin으로 준다. `--allowed-tools`가 값을 여러 개 받는
          # variadic 옵션이라, 뒤에 인자로 붙이면 그것까지 도구 목록으로 먹고
          # "Input must be provided either through stdin or as a prompt argument"로
          # 끝난다(2026-09-29 실측).
          claude -p --allowed-tools "Read,Edit,Grep,Glob" < ./.github/self-heal-prompt.md

      - name: Enforce change scope
        if: steps.guard.outputs.open == '0'
        run: |
          set -euo pipefail
          changed=$(git diff --name-only)
          if [ -z "$changed" ]; then
            echo "에이전트가 아무것도 수정하지 않았다. 이 범위로 고칠 수 없는 원인이다."
            exit 1
          fi
          # 허용 목록 밖을 건드렸으면 전체를 되돌린다. 일부만 남기면 반쪽짜리
          # 수정이 PR로 올라간다.
          for path in $changed; do
            case " $ALLOWED_PATHS " in
              *" $path "*) ;;
              *)
                echo "허용되지 않은 파일을 수정했다: $path"
                git checkout -- .
                exit 1
                ;;
            esac
          done
          echo "수정된 파일: $changed"

      - name: Verify
        if: steps.guard.outputs.open == '0'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip pytest
          python -m pytest tests/ -q
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/bench.yml'))"

      - name: Open a pull request
        if: steps.guard.outputs.open == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -- $ALLOWED_PATHS
          git commit -m "fix: 예정된 실행 실패에 대한 자동 수정안"
          git push --force-with-lease origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "자동 수정안: 예정된 벤치마크 실행 실패" \
            --body "$(printf 'A repair agent proposed this change after a scheduled `bench` run failed.\n\nThe agent may only modify `%s`; the workflow reverts everything and fails if it touches anything else, and it runs without shell access. `pytest tests/` passed before this PR was opened.\n\nReview this as untrusted output: confirm the diagnosis model stays in the cheap tier and that no measurement logic changed.\n\nFailed run: %s/%s/actions/runs/%s\n' \
              "$ALLOWED_PATHS" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "${RUN_ID:-manual}")"
