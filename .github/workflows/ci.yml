name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: make smoke
      - run: make report
      - run: git diff --exit-code docs/GENERATED_RESULTS.md
      - run: git grep -nE 'sk-ant-api03-|ANTHROPIC_API_KEY=.+|/Users/yang/' -- . ':!.github/workflows/ci.yml' && exit 1 || exit 0
