name: ci

# push는 main에만 돈다 — feature 브랜치는 pull_request 이벤트로 이미 커버되므로
# 열린 PR에 push하면 같은 커밋에 CI가 두 번(push+pull_request) 도는 중복을 없앤다.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # main은 사람만 쓴다. 측정 결과는 data 브랜치가, 코드 수정안은
  # self-heal.yml의 PR이 담당하므로 main에 봇 push가 일어날 이유가 없다.
  # 일어났다면 그 경로가 새로 생긴 것이고, 그건 규칙이 깨진 것이다.
  no-bot-push-to-main:
    if: github.event_name == 'push' && github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: main is human-only
        run: |
          echo "자동화가 main에 직접 push했다. 데이터는 data 브랜치로, 코드는 PR로 가야 한다."
          exit 1

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Check web scripts parse
        run: |
          node --check web/app.js
          node --check web/settings.js
      - name: Check quickstart.sh syntax
        if: runner.os != 'Windows'
        run: bash -n quickstart.sh
      - name: Check quickstart.ps1 parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("quickstart.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
      - name: Run unit and doc tests
        run: python -m pytest tests/ -v
      # 공개 저장소이므로 API key와 로컬 절대경로가 섞여 들어가면 즉시 실패시킨다.
      # `sk-ant-oat`는 `claude setup-token`이 발급하는 장기 구독 토큰이고
      # `sk-ant-admin`은 Admin API key다. 둘 다 api03 키와 같은 등급의 비밀인데
      # 예전 패턴은 api03만 봤다.
      - name: Guard against leaked secrets and local paths
        if: runner.os == 'Linux'
        run: git grep -nE 'sk-ant-(api03|oat|admin)-|ANTHROPIC_API_KEY=.+|CLAUDE_CODE_OAUTH_TOKEN=.+|/Users/yang/' -- . ':!.github/workflows/ci.yml' && exit 1 || exit 0
